<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Note">
<meta name="theme-color" content="#121318">
<title>TV Note</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121318'/%3E%3Cpath d='M16 18h32a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H30l-9 7v-7h-5a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z' fill='%23F4C95D'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121318'/%3E%3Cpath d='M16 18h32a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H30l-9 7v-7h-5a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z' fill='%23F4C95D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* One column, thumb-first: the composer on top, the Send bar pinned to the bottom like a messaging app. */
:root {
  --bg: #F3F1EC;          /* paper the note is written on */
  --surface: #FFFFFF;
  --ink: #17181D;
  --muted: #6B6C73;
  --line: #DEDBD3;
  --accent: #C9961C;      /* the TV label's amber, darkened for light paper */
  --accent-ink: #17181D;
  --screen: #121318;      /* the TV glass: the drawing pad is always this, in both themes */
  --danger: #B3261E;
  --ok: #2E7D4F;
  --font: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0D11; --surface: #17181E; --ink: #F2F1EE; --muted: #9A9BA3; --line: #2A2B33;
    --accent: #F4C95D; --accent-ink: #17181D; --danger: #F2847B; --ok: #7BD3A0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0D11; --surface: #17181E; --ink: #F2F1EE; --muted: #9A9BA3; --line: #2A2B33;
  --accent: #F4C95D; --accent-ink: #17181D; --danger: #F2847B; --ok: #7BD3A0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
.app {
  min-height: 100%; display: flex; flex-direction: column; gap: 16px; max-width: 560px; margin: 0 auto;
  padding-top: max(18px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-weight: 500; font-size: 22px; letter-spacing: -0.01em; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok .dot { background: var(--ok); }
.status.bad .dot { background: var(--danger); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 15px var(--font); padding: 10px; border-radius: 10px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.field label { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
textarea, input[type=text] {
  width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px;
  font: 400 18px/1.4 var(--font); padding: 14px 16px; outline: none;
}
textarea { min-height: 170px; resize: vertical; }
textarea:focus, input[type=text]:focus { border-color: var(--accent); }
.count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

.pad-wrap { position: relative; border-radius: 16px; overflow: hidden; background: var(--screen); box-shadow: inset 0 0 0 1px #ffffff1a; }
canvas#pad { display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; touch-action: none; cursor: crosshair; }
.pad-hint { position: absolute; inset: 0; display: grid; place-items: center; color: #ffffff59; font-size: 15px; pointer-events: none; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.swatches, .sizes { display: flex; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--bg); box-shadow: 0 0 0 2px var(--ink); }
.size { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.size span { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.spacer { flex: 1; }
.ghost { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--font); padding: 8px 14px; border-radius: 10px; }

.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row .field { flex: 1 1 180px; min-width: 0; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.send {
  flex: 1; appearance: none; border: 0; background: var(--accent); color: var(--accent-ink);
  font: 600 17px var(--font); padding: 15px; border-radius: 14px;
}
.send:disabled { opacity: 0.5; }
.clear-tv { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 14px var(--font); padding: 14px 14px; border-radius: 14px; white-space: nowrap; }
button:focus-visible, .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { min-height: 20px; font-size: 14px; color: var(--muted); text-align: center; }
.toast.ok { color: var(--ok); }
.toast.bad { color: var(--danger); }

.unpaired { display: grid; gap: 10px; padding: 22px; border: 1px dashed var(--line); border-radius: 16px; background: var(--surface); }
.unpaired p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .send { transition: transform .12s ease; } .send:active { transform: scale(.98); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Living room TV</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
  </header>

  <section class="unpaired" id="unpaired" hidden>
    <strong>This phone isn't paired yet</strong>
    <p>Open the setup link you were given (the long one ending in a code after #). After that, this page remembers the TV.</p>
  </section>

  <main id="composer" style="display:contents">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabWrite" aria-selected="true" aria-controls="paneWrite">Write</button>
      <button role="tab" id="tabDraw" aria-selected="false" aria-controls="paneDraw">Draw</button>
    </div>

    <section id="paneWrite" role="tabpanel" class="field">
      <label for="text">Message</label>
      <textarea id="text" maxlength="600" placeholder="Dinner's ready, pause the game 🍝"></textarea>
      <div class="count"><span id="count">0</span> / 600</div>
    </section>

    <section id="paneDraw" role="tabpanel" hidden>
      <div class="pad-wrap">
        <canvas id="pad" width="1280" height="720" aria-label="Drawing pad"></canvas>
        <div class="pad-hint" id="padHint">Draw with your finger</div>
      </div>
      <div class="tools" style="margin-top:12px">
        <div class="swatches" id="swatches"></div>
        <div class="sizes" id="sizes"></div>
        <span class="spacer"></span>
        <button class="ghost" id="undo">Undo</button>
        <button class="ghost" id="wipe">Erase all</button>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="caption">Caption (optional)</label>
        <input type="text" id="caption" maxlength="120" placeholder="Happy birthday!">
      </div>
    </section>

    <div class="row">
      <div class="field">
        <label for="from">Your name (optional)</label>
        <input type="text" id="from" maxlength="24" placeholder="Shown on the TV" autocomplete="nickname">
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<div class="bar" id="bar">
  <div class="bar-inner">
    <button class="clear-tv" id="clearTv">Clear TV</button>
    <button class="send" id="send">Send to TV</button>
  </div>
</div>

<script>
(() => {
  const RELAY = "https://ntfy.sh/";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // Pairing: #t=<topic>&k=<base64url key>. The part after # never leaves the phone.
  function readPairing() {
    const h = new URLSearchParams(location.hash.slice(1));
    let t = h.get("t"), k = h.get("k");
    if (t && k) { store.set("tvnote.t", t); store.set("tvnote.k", k); }
    else { t = store.get("tvnote.t"); k = store.get("tvnote.k"); }
    if (!t || !k || !/^[A-Za-z0-9_-]{8,64}$/.test(t)) return null;
    return { topic: t, key: k };
  }
  const pairing = readPairing();
  let cryptoKey = null;

  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  }
  function bytesToB64(bytes) {
    let out = ""; const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  async function getKey() {
    if (!cryptoKey) cryptoKey = await crypto.subtle.importKey("raw", b64urlToBytes(pairing.key), "AES-GCM", false, ["encrypt"]);
    return cryptoKey;
  }
  async function seal(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await getKey(),
      new TextEncoder().encode(JSON.stringify(obj))));
    const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
    return "tvm1:" + bytesToB64(all);
  }

  function setStatus(kind, text) { $("status").className = "status " + (kind || ""); $("statusText").textContent = text; }
  function toast(kind, text) { const t = $("toast"); t.className = "toast " + (kind || ""); t.textContent = text; }

  if (!pairing) {
    $("unpaired").hidden = false; $("composer").hidden = true; $("bar").hidden = true;
    setStatus("bad", "Not paired");
    return;
  }

  // Tabs
  let mode = "write";
  function setMode(m) {
    mode = m;
    $("tabWrite").setAttribute("aria-selected", m === "write");
    $("tabDraw").setAttribute("aria-selected", m === "draw");
    $("paneWrite").hidden = m !== "write"; $("paneDraw").hidden = m !== "draw";
    store.set("tvnote.mode", m); updateSend();
  }
  $("tabWrite").onclick = () => setMode("write");
  $("tabDraw").onclick = () => setMode("draw");

  // Text
  const text = $("text");
  text.value = store.get("tvnote.draft") || "";
  text.addEventListener("input", () => { $("count").textContent = text.value.length; store.set("tvnote.draft", text.value); updateSend(); });
  $("count").textContent = text.value.length;
  const from = $("from");
  from.value = store.get("tvnote.from") || "";
  from.addEventListener("input", () => store.set("tvnote.from", from.value));

  // Drawing pad: strokes kept as point lists so Undo can redraw.
  const pad = $("pad"), ctx = pad.getContext("2d");
  const COLORS = ["#FFFFFF", "#F4C95D", "#FF7A90", "#6FD3FF", "#8BE38B", "#C79BFF"];
  const SIZES = [6, 14, 28];
  let color = COLORS[0], size = SIZES[1], strokes = [], current = null;
  COLORS.forEach((c, i) => {
    const b = document.createElement("button"); b.className = "swatch"; b.style.background = c;
    b.setAttribute("aria-label", "Colour " + (i + 1)); b.setAttribute("aria-pressed", i === 0);
    b.onclick = () => { color = c; document.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", s === b)); };
    $("swatches").appendChild(b);
  });
  SIZES.forEach((s, i) => {
    const b = document.createElement("button"); b.className = "size"; b.setAttribute("aria-label", ["Thin", "Medium", "Thick"][i]);
    b.setAttribute("aria-pressed", i === 1);
    const dotEl = document.createElement("span"); const d = [5, 10, 17][i]; dotEl.style.width = dotEl.style.height = d + "px"; b.appendChild(dotEl);
    b.onclick = () => { size = s; document.querySelectorAll(".size").forEach((x) => x.setAttribute("aria-pressed", x === b)); };
    $("sizes").appendChild(b);
  });
  function drawStroke(st) {
    const p = st.pts; if (!p.length) return;
    ctx.strokeStyle = st.color; ctx.fillStyle = st.color; ctx.lineWidth = st.size; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], st.size / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my);
    }
    const l = p[p.length - 1]; ctx.lineTo(l[0], l[1]); ctx.stroke();
  }
  function redraw() { ctx.clearRect(0, 0, pad.width, pad.height); strokes.forEach(drawStroke); if (current) drawStroke(current); $("padHint").hidden = strokes.length > 0 || !!current; updateSend(); }
  function pt(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; }
  pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); current = { color, size, pts: [pt(e)] }; redraw(); });
  pad.addEventListener("pointermove", (e) => { if (!current) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach((ev) => current.pts.push(pt(ev))); redraw(); });
  const end = () => { if (current) { strokes.push(current); current = null; redraw(); } };
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);
  $("undo").onclick = () => { strokes.pop(); redraw(); };
  $("wipe").onclick = () => { strokes = []; redraw(); };

  // Crop to the drawing, with a margin, so the TV shows it large.
  function exportDrawing() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    strokes.forEach((s) => s.pts.forEach(([x, y]) => { const h = s.size / 2; x0 = Math.min(x0, x - h); y0 = Math.min(y0, y - h); x1 = Math.max(x1, x + h); y1 = Math.max(y1, y + h); }));
    const m = 24; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(pad.width, x1 + m); y1 = Math.min(pad.height, y1 + m);
    const w = Math.max(1, Math.round(x1 - x0)), h = Math.max(1, Math.round(y1 - y0));
    const out = document.createElement("canvas"); out.width = w; out.height = h;
    out.getContext("2d").drawImage(pad, x0, y0, w, h, 0, 0, w, h);
    return out.toDataURL("image/png").split(",")[1];
  }

  function updateSend() {
    $("send").disabled = busy || (mode === "write" ? !text.value.trim() : strokes.length === 0);
  }
  let busy = false;
  async function publish(payload, okText) {
    busy = true; updateSend(); $("clearTv").disabled = true; toast("", "Sending…");
    try {
      const body = await seal(payload);
      const res = await fetch(RELAY + pairing.topic, { method: "PUT", body });
      if (!res.ok) throw new Error(res.status === 429 ? "Too many messages today. Try again later." : "The relay answered " + res.status + ".");
      const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      toast("ok", okText + " at " + t); setStatus("ok", "Sent " + t);
      return true;
    } catch (e) {
      toast("bad", (e && e.message && !/fetch/i.test(e.message)) ? e.message : "Couldn't reach the relay. Check your connection and try again.");
      setStatus("bad", "Not sent");
      return false;
    } finally { busy = false; updateSend(); $("clearTv").disabled = false; }
  }

  $("send").onclick = async () => {
    const base = { v: 1, from: from.value.trim().slice(0, 24), ts: Date.now() };
    if (mode === "write") {
      if (await publish({ ...base, kind: "text", text: text.value.trim() }, "On the TV")) { text.value = ""; store.set("tvnote.draft", ""); $("count").textContent = 0; updateSend(); }
    } else {
      if (await publish({ ...base, kind: "draw", text: $("caption").value.trim(), img: exportDrawing() }, "Drawing on the TV")) { $("caption").value = ""; }
    }
  };
  let clearArmed = null;
  $("clearTv").onclick = async () => {
    if (!clearArmed) { $("clearTv").textContent = "Tap to confirm"; clearArmed = setTimeout(() => { clearArmed = null; $("clearTv").textContent = "Clear TV"; }, 3000); return; }
    clearTimeout(clearArmed); clearArmed = null; $("clearTv").textContent = "Clear TV";
    await publish({ v: 1, kind: "clear", ts: Date.now() }, "Cleared the TV");
  };

  setMode(store.get("tvnote.mode") === "draw" ? "draw" : "write");
  redraw();
})();
</script>
</body>
</html>
